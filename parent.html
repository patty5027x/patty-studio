<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>上課小頁面</title>
<meta name="theme-color" content="#F3EDE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上課小頁面" id="appTitle">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<style>
@font-face{font-family:"GenSen Rounded";src:url("fonts/gensen-R.woff") format("woff");font-weight:400 500;font-display:swap}
@font-face{font-family:"GenSen Rounded";src:url("fonts/gensen-B.woff") format("woff");font-weight:600 900;font-display:swap}
/* Parent page: same notebook look as the teacher app — paper, 1.5px ink lines, medium radii. Read-only except asking for a gift. */
:root{
  color-scheme:light;
  --paper:#FFFCF6; --ink:#3E3A39; --brown:#4C4541; --yellow:#F2C46A; --cream:#FCF0DA;
  --orange:#EB895B; --sky:#97D7FF; --muted:#8A817A; --hair:#E4DBCD;
  --line:1.5px solid var(--ink); --r:12px; --r-sm:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);margin:0}
body{color:var(--brown);font-family:"GenSen Rounded","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.6;letter-spacing:.03em;-webkit-text-size-adjust:100%;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;margin:0;color:var(--ink);letter-spacing:.08em}
h2{font-size:15px;margin:22px 2px 8px;color:var(--ink);letter-spacing:.12em;display:flex;align-items:baseline;gap:8px}
h2 small{font-size:11px;color:var(--muted);letter-spacing:.2em;font-weight:400}
.sub{color:var(--muted);font-size:13px}
.panel{border:var(--line);border-radius:var(--r);background:#fff;padding:12px 14px}
.head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:var(--line)}
.avatar{width:46px;height:46px;border-radius:12px;border:var(--line);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{font-size:19px;font-weight:700;color:var(--ink)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--ink);border-radius:6px;padding:0 7px;background:var(--cream);color:var(--ink);white-space:nowrap}
.tag.y{background:var(--yellow)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.slot{border:1.5px solid var(--ink);border-radius:var(--r-sm);text-align:center;font-size:12px;padding:5px 0;line-height:1.3}
.slot b{display:block;font-size:13px;color:var(--ink)}
.slot.done{background:var(--sky)}
.slot.charged{background:var(--cream)}
.slot.todo{border-style:dashed;color:var(--muted)}
.pts{font-size:30px;font-weight:700;color:var(--ink);line-height:1.1}
.bar{height:10px;border:var(--line);border-radius:6px;overflow:hidden;background:var(--paper);margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--yellow)}
.tierh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.tierh b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gift{border:var(--line);border-radius:var(--r);overflow:hidden;background:#fff;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;position:relative}
.gift img,.gift .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-bottom:var(--line);background:var(--cream)}
.gift .ph{display:grid;place-items:center;font-size:34px}
.gift span.n{display:block;padding:7px 9px;font-size:14px}
.gift[disabled]{cursor:default}
.gift[disabled] img,.gift[disabled] .ph{filter:grayscale(.8);opacity:.55}
.gift .lock{position:absolute;top:6px;right:6px;font-size:11px;background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 6px}
.btn{font:inherit;font-size:14px;border:var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn.primary{background:var(--yellow);font-weight:700}
.btn:focus-visible,.gift:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.confirm{border:var(--line);border-radius:var(--r);background:var(--cream);padding:12px 14px;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.list>div{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--hair)}
.list>div:first-child{border-top:0;padding-top:0}
.list .d{width:44px;color:var(--ink);font-variant-numeric:tabular-nums;flex-shrink:0}
.list .m{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:14px;max-width:90vw;z-index:9}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:13px}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.pnav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.pnav button{border:0;background:none;padding:7px 0 9px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.pnav .ic{width:48px;height:38px;display:grid;place-items:center;border-radius:12px;transition:background .15s}
.pnav button[aria-selected="true"]{color:var(--ink);font-weight:700}
.pnav button[aria-selected="true"] .ic{background:var(--cream)}
.pnav button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--hair);background:none;padding:8px 0 0;margin-top:4px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.seg{display:flex;border:var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;padding:6px 0;color:var(--ink);cursor:pointer}
.seg button+button{border-left:var(--line)}
.seg button[aria-pressed="true"]{background:var(--yellow);font-weight:700}
.vid{border:var(--line);border-radius:var(--r);overflow:hidden;background:#fff;margin-top:12px}
.vth{display:block;width:100%;aspect-ratio:16/9;position:relative;border:0;padding:0;background:#2E2A28;cursor:pointer;border-bottom:var(--line)}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vth .pl{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(255,252,246,.92);border:var(--line);display:grid;place-items:center;font-size:20px;color:var(--ink)}
.vid iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-bottom:var(--line)}
.vinfo{padding:9px 12px}
.vinfo b{color:var(--ink)}
.vnote{font-size:13px;background:var(--cream);border-radius:var(--r-sm);padding:6px 10px;margin-top:6px}
.vmini{display:flex;gap:10px;align-items:center;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;width:100%}
.vmini img{width:104px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:var(--line);flex-shrink:0}
.h2link{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:400;border:0;background:none;font-family:inherit;cursor:pointer;padding:0}
.ptitle{font-size:19px;color:var(--ink);font-weight:700;letter-spacing:.08em}


/* ===== Theme: 北歐森林 ===== */
:root{--paper:#F3EDE4;--ink:#2F3A33;--brown:#3D4740;--muted:#8A938B;--hair:#EEE8DE;--cream:#F1ECE3;--yellow:#E3EBE0;--green:#3F5A47;--sage:#E3EBE0;--edge:#DCD5C8;--line:1px solid var(--edge);--r:18px;--shadow:0 0 0 1px rgba(47,58,51,.06),0 1px 3px rgba(47,58,51,.05)}
html,body{background:var(--paper)}
.head{border-bottom:0;padding-bottom:4px}
.avatar{border:0;border-radius:16px}
h2{letter-spacing:.08em}
.panel,.gift,.vid{border:0;box-shadow:var(--shadow);background:#fff}
.tag{border:0;background:var(--cream)}
.tag.y{background:var(--sage);color:var(--green)}
.slot{border:0;background:#F4F0E8}
.slot.done{background:var(--sage);color:var(--green)}
.slot.done b{color:var(--green)}
.slot.charged{background:#F6E7DD}
.slot.todo{background:transparent;box-shadow:inset 0 0 0 1px var(--edge)}
.bar{border:0;background:#EAE4D9;border-radius:999px}
.bar i{background:var(--green)}
.gift img,.gift .ph,.vth{border-bottom:0}
.gift .lock{background:var(--green)}
.vid iframe{border-bottom:0}
.vth .pl{border:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.vmini img{border:0}
.btn{border:0;box-shadow:inset 0 0 0 1px var(--edge);border-radius:999px;background:#fff}
.btn.primary{background:var(--green);color:#fff;box-shadow:none}
.seg{border:0;background:#EAE4D9;border-radius:999px;padding:3px;gap:2px}
.seg button{border-radius:999px;transition:background .18s}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.confirm{border:0;background:var(--sage)}
.vnote{background:var(--cream)}
.toast{background:var(--green);border-radius:999px}
.pnav{background:rgba(243,237,228,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--edge)}
.pnav button{color:var(--muted)}
.pnav .ic{width:56px;height:32px}
.pnav button[aria-selected="true"]{color:var(--green)}
.pnav button[aria-selected="true"] .ic{background:var(--sage)}
@media (prefers-reduced-motion:no-preference){
  #app.in-r{animation:slideR .22s cubic-bezier(.25,.8,.3,1) both}
  #app.in-l{animation:slideL .22s cubic-bezier(.25,.8,.3,1) both}
  .btn,.gift,.vth,.vmini,.seg button,.pnav .ic,.h2link{transition:transform .14s ease,background-color .18s}
  .btn:active,.gift:not([disabled]):active,.vth:active,.vmini:active,.seg button:active{transform:scale(.96)}
  .pnav button:active .ic{transform:scale(.9)}
  .confirm{animation:riseIn .28s cubic-bezier(.2,.75,.25,1) both}
  .vid iframe{animation:fadeIn .3s ease both}
}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.55;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:.55;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">讀取中…</div></div>
<nav class="pnav" id="pnav" role="tablist" aria-label="頁面" hidden>
  <button role="tab" data-tab="home" aria-selected="true"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4.5 20 11"/><path d="M6 9.6V20h12V9.6"/><path d="M10 20v-5a2 2 0 0 1 4 0v5"/></svg></span>首頁</button>
  <button role="tab" data-tab="vid" aria-selected="false"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6.5" width="12.5" height="11" rx="3"/><path d="M16 10.5l4.5-2.5v8l-4.5-2.5"/><path d="M8.5 9.8v4.4l3.6-2.2z" fill="currentColor" stroke="none"/></svg></span>影片</button>
  <button role="tab" data-tab="gift" aria-selected="false"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="11" width="15" height="9" rx="2"/><rect x="3.5" y="7.5" width="17" height="3.5" rx="1.2"/><path d="M12 7.5V20"/><path d="M12 7.5c-1.8-3.2-5.2-3-4.8-.9.3 1.4 3 1.2 4.8.9zM12 7.5c1.8-3.2 5.2-3 4.8-.9-.3 1.4-3 1.2-4.8.9z"/></svg></span>禮物</button>
</nav>
<div class="toast" id="toast" hidden role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const WD='日一二三四五六';
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
const mdw=s=>`${md(s)}（${WD[parse(s).getDay()]}）`;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const KIND={moved:'調課',makeup:'補課',add:'加課'};
let toastT;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2600)}

/* the link carries the code; remember it so the home-screen icon keeps working */
let K=new URLSearchParams(location.search).get('k')||'';
try{if(K)localStorage.setItem('k',K);else K=localStorage.getItem('k')||''}catch{}
if(!K){app.innerHTML='<div class="empty">這個連結不完整，請跟老師要一次新的連結。</div>'}
else{
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs=firebase.firestore();
  const ref=fs.collection('share').doc(K);
  let D=null,G=[],R=[],pick=null,giftsFor=null,busy=false;
  let tab='home',histN=3,onlyOk=false,playing=null;
  const nav=document.getElementById('pnav');
  const thumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  ref.onSnapshot(doc=>{
    if(!doc.exists){D=null;app.innerHTML='<div class="empty">這個連結已經停用了。<br>請跟老師要新的連結☺️</div>';return}
    D=doc.data();
    document.title=`${D.name}的上課小頁面`;document.getElementById('appTitle').content=`${D.name}的上課`;
    if(D.uid&&giftsFor!==D.uid){giftsFor=D.uid;fs.collection('pubGifts').doc(D.uid).collection('items').onSnapshot(s=>{G=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.tier-b.tier)||((a.order||0)-(b.order||0)));draw()},()=>{})}
    draw();
  },()=>{app.innerHTML='<div class="empty">讀取失敗，請確認網路後重新整理。</div>'});
  ref.collection('requests').onSnapshot(s=>{R=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||'').localeCompare(a.at||''));draw()},()=>{});

  const PT=['home','vid','gift'];function setTab(t){const dir=PT.indexOf(t)>PT.indexOf(tab)?'in-r':PT.indexOf(t)<PT.indexOf(tab)?'in-l':'';tab=t;playing=null;nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));draw();scrollTo(0,0);app.classList.remove('in-r','in-l');if(dir){void app.offsetWidth;app.classList.add(dir)}clearTimeout(setTab._t);setTab._t=setTimeout(()=>app.classList.remove('in-r','in-l'),400)}
  function draw(){
    if(!D)return;
    nav.hidden=false;
    const t=today(),pend=R.find(r=>r.status==='pending');
    const tiers=[...new Set(G.map(g=>g.tier))].sort((a,b)=>a-b);
    const nx=tiers.find(x=>x>D.points),prev=[...tiers].reverse().find(x=>x<=D.points)||0;
    const ptCard=`<div class="between"><span class="pts num">⭐ ${D.points}</span>${pend?'<span class="tag y">兌換申請中</span>':''}</div>
      ${tiers.length?`<div class="bar"><i style="width:${nx?Math.max(0,Math.min(100,(D.points-prev)/(nx-prev)*100)):100}%"></i></div><div class="sub">${nx?`再 ${nx-D.points} 點可以換 ${nx} 點的禮物`:'所有禮物都換得起了！'}</div>`:''}`;
    const vids=D.videos||[];
    let h='';
    if(tab==='home'){
      const next=(D.upcoming||[]).find(u=>u.date>=t),p=D.period,hist=D.history||[];
      h+=`<div class="head"><div class="avatar" style="background:${D.source==='fama'?'#FBE3D6':'#DDF1FD'}">${D.instrument==='鋼琴'?'🎹':D.instrument==='小提琴'?'🎻':'🎵'}</div>
        <div><h1>${esc(D.name)}</h1><div class="sub">${esc([D.instrument,D.schedule].filter(Boolean).join('・'))}</div></div></div>`;
      h+=`<h2>下一堂課<small>NEXT</small></h2><div class="panel">${next?`<div class="big">${mdw(next.date)} ${esc(next.time||'')}</div>${next.kind?`<span class="tag">${KIND[next.kind]||''}</span>`:''}`:'<span class="sub">還沒有排到課</span>'}</div>`;
      if(p)h+=`<h2>第 ${p.no} 期<small>LESSONS</small></h2><div class="panel"><div class="between"><span>${p.unpaid?'這期還沒繳費':'這期上課進度'}</span><span class="tag ${p.unpaid?'y':''}">上到 ${p.used} / ${p.cap}</span></div>
        <div class="slots">${(p.slots||[]).map(x=>`<div class="slot ${x.st}"><b>${md(x.date)}</b>${x.st==='todo'?(KIND[x.kind]?KIND[x.kind]+'・待上':'待上'):x.st==='charged'?'請假':(KIND[x.kind]||'出席')}</div>`).join('')}</div></div>`;
      h+=`<h2>我的點數<small>POINTS</small><button class="h2link" data-act="tab" data-t="gift">看禮物 ›</button></h2><div class="panel">${ptCard}
        ${hist.length?`<div class="list" style="margin-top:10px">${hist.slice(0,histN).map(x=>`<div><span class="d">${md(x.date)}</span><span class="m">${esc(x.reason||(x.delta>0?'加點':'扣點'))}</span><b class="num" style="color:var(--ink)">${x.delta>0?'+':''}${x.delta}</b></div>`).join('')}</div>
        ${hist.length>histN?`<button class="more" data-act="histMore">看更多（還有 ${hist.length-histN} 筆）</button>`:''}`:''}</div>`;
      if(vids.length)h+=`<h2>最新影片<small>VIDEO</small><button class="h2link" data-act="tab" data-t="vid">全部 ›</button></h2><div class="panel"><button class="vmini" data-act="tab" data-t="vid"><img src="${thumb(vids[0].yt)}" alt=""><span><b style="color:var(--ink)">${esc(vids[0].title||'演奏影片')}</b><br><span class="sub">${vids[0].date?md(vids[0].date):''}</span></span></button></div>`;
      if((D.scores||[]).length)h+=`<h2>要帶的譜<small>SHEET MUSIC</small></h2><div class="panel list">${D.scores.map(x=>`<div><span class="d">${md(x.date)}</span><span class="m">${esc(x.title)}</span></div>`).join('')}</div>`;
      if((D.materials||[]).length)h+=`<h2>正在學<small>BOOKS</small></h2><div class="panel">${D.materials.map(esc).join('<br>')}</div>`;
      h+=`<div class="foot">要請假或調課，請直接 LINE 老師喔☺️</div>`;
    }
    if(tab==='vid'){
      h+=`<div class="ptitle">演奏影片</div><div class="sub">${vids.length?'點影片就能直接播放':''}</div>`;
      if(!vids.length)h+='<div class="empty">還沒有影片，老師錄好之後會放在這裡☺️</div>';
      vids.forEach((v,i)=>{h+=`<div class="vid">${playing===i?`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.yt)}?autoplay=1&playsinline=1&rel=0&modestbranding=1" title="${esc(v.title||'演奏影片')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
        :`<button class="vth" data-act="play" data-i="${i}" aria-label="播放 ${esc(v.title||'演奏影片')}"><img src="${thumb(v.yt)}" alt="" loading="lazy"><span class="pl">▶</span></button>`}
        <div class="vinfo"><b>${esc(v.title||'演奏影片')}</b><div class="sub">${v.date?mdw(v.date):''}</div>${v.note?`<div class="vnote">老師的話：${esc(v.note)}</div>`:''}</div></div>`});
    }
    if(tab==='gift'){
      h+=`<div class="between"><span class="ptitle">禮物</span><span class="big num">⭐ ${D.points}</span></div>`;
      if(pend)h+=`<div class="confirm"><b style="color:var(--ink)">已送出：想換「${esc(pend.giftName)}」（${pend.tier} 點）</b><div class="sub">等老師確認後，下次上課就能拿到禮物☺️</div><div class="row"><button class="btn" data-act="cancel" data-id="${pend.id}">取消申請</button></div></div>`;
      else if(pick){const g=G.find(x=>x.id===pick);if(g)h+=`<div class="confirm"><b style="color:var(--ink)">確定要用 ${g.tier} 點換「${esc(g.name)}」嗎？</b><div class="sub">送出後老師會收到通知，確認了才會扣點。</div><div class="row"><button class="btn primary" data-act="send">確定兌換</button><button class="btn" data-act="unpick">再想想</button></div></div>`}
      if(!G.length)h+='<div class="empty">老師還沒放禮物喔</div>';
      else{h+=`<div class="seg" role="group" aria-label="顯示"><button data-act="ok" data-v="0" aria-pressed="${!onlyOk}">全部</button><button data-act="ok" data-v="1" aria-pressed="${onlyOk}">換得起</button></div>`;
        let any=false;
        for(const tr of tiers){const lack=tr-D.points;if(onlyOk&&lack>0)continue;any=true;const gs=G.filter(g=>g.tier===tr);
          h+=`<div class="tierh"><b>${tr} 點</b>${lack>0?`<span class="sub">還差 ${lack} 點</span>`:''}</div><div class="grid">${gs.map(g=>`<button class="gift" data-act="pick" data-id="${g.id}" ${lack>0||pend?'disabled':''} aria-label="${esc(g.name)}，${g.tier} 點">${g.img?`<img src="${g.img}" alt="">`:'<span class="ph">🎁</span>'}<span class="n">${esc(g.name)}</span>${lack>0?'<span class="lock">🔒</span>':''}</button>`).join('')}</div>`}
        if(!any)h+=`<div class="empty">再 ${(nx||0)-D.points} 點就能換第一個禮物了，加油☺️</div>`}
      const done=R.filter(r=>r.status!=='pending').slice(0,8);
      if(done.length)h+=`<h2>兌換紀錄<small>HISTORY</small></h2><div class="panel list">${done.map(r=>`<div><span class="d">${md((r.doneAt||r.at||'').slice(0,10)||t)}</span><span class="m">${esc(r.giftName)}</span><span class="tag ${r.status==='done'?'y':''}">${r.status==='done'?'已兌換':'老師婉拒了'}</span></div>`).join('')}</div>`;
    }
    app.innerHTML=h;
  }
  nav.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab)});
  document.addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
    const a=b.dataset.act;
    if(a==='tab'){setTab(b.dataset.t);return}
    if(a==='histMore'){histN+=10;draw();return}
    if(a==='play'){playing=+b.dataset.i;draw();return}
    if(a==='ok'){onlyOk=b.dataset.v==='1';draw();return}
    if(a==='pick'){pick=b.dataset.id;draw();scrollTo({top:0,behavior:'smooth'});return}
    if(a==='unpick'){pick=null;draw();return}
    if(a==='send'&&!busy){const g=G.find(x=>x.id===pick);if(!g)return;busy=true;
      try{await ref.collection('requests').add({giftId:g.id,giftName:String(g.name||'禮物').slice(0,60),tier:+g.tier,at:new Date().toISOString(),status:'pending',uid:D.uid});pick=null;toast('已送出，老師會收到通知')}
      catch(err){toast('送出失敗，請稍後再試')}busy=false;draw();return}
    if(a==='cancel'){try{await ref.collection('requests').doc(b.dataset.id).delete();toast('已取消申請')}catch{toast('取消失敗，可能老師已經處理了')}}
  });
}
</script>
</body>
</html>
