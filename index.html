<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PATTY.STUDIO</title>
<meta name="theme-color" content="#FFFCF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PATTY.STUDIO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/gensen-R.woff" as="font" type="font/woff" crossorigin>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.login{max-width:380px;margin:40px auto;padding:22px;display:flex;flex-direction:column;gap:12px}
</style>
<style>
@font-face{font-family:"GenSen Rounded";src:url("fonts/gensen-R.woff") format("woff");font-weight:400 500;font-display:swap}
@font-face{font-family:"GenSen Rounded";src:url("fonts/gensen-B.woff") format("woff");font-weight:600 900;font-display:swap}
/* Layout: Japanese minimal notebook — flat washi paper, fine 1.5px ink lines, medium radii, pixel-art icons; nav bar with a raised calendar key in the middle. Light only. */
:root{
  color-scheme:light;
  --paper:#FFFCF6; --ink:#3E3A39; --brown:#4C4541; --yellow:#F2C46A; --olive:#AEAC78; --cream:#FCF0DA;
  --red:#790D16; --orange:#EB895B; --sky:#97D7FF;
  --muted:#8A817A; --hair:#E4DBCD;
  --f-body:"GenSen Rounded","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --line:1.5px solid var(--ink); --r:12px; --r-sm:8px;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--brown);font-family:var(--f-body);font-size:15px;line-height:1.65;letter-spacing:.03em}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 140px}

.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:var(--line);padding-bottom:6px;margin-bottom:14px}
.mast .eyebrow{font-size:11px;letter-spacing:.32em;color:var(--muted)}
.mast{align-items:center}
.brand{display:flex;align-items:center;gap:7px}
.mast h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.14em;color:var(--ink);line-height:1.2}
.mast .issue{text-align:right;font-size:11px;color:var(--muted);line-height:1.5;letter-spacing:.06em;flex-shrink:0}
.mast .issue{display:flex;align-items:center;gap:8px;line-height:1.2}
.mast .issue b{display:inline;font-size:11px;color:var(--ink);letter-spacing:.06em;font-weight:500}
.mast .issue .sub2{display:flex;gap:8px;justify-content:flex-end;align-items:center}
@media (max-width:420px){.mast h1{font-size:15px;letter-spacing:.1em}.mast .issue b{display:none}}

h2{font-size:18px;margin:0;font-weight:700;color:var(--ink);letter-spacing:.14em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
nav.tabs button:focus{outline:none}
nav.tabs button:focus-visible .ic,nav.tabs button:focus-visible .key{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.btn{border:var(--line);background:var(--paper);border-radius:var(--r-sm);padding:4px 12px;color:var(--ink);font-weight:500;letter-spacing:.08em}
.btn.primary{background:var(--yellow)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--brown);text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--paper);border:var(--line);border-radius:var(--r)}
.list>*+*{border-top:1px solid var(--hair)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;min-width:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:700;color:var(--ink);cursor:pointer;letter-spacing:.06em}
.item.click{cursor:pointer}

.tag{display:inline-flex;align-items:center;font-size:12px;padding:0 8px;height:21px;border-radius:999px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);white-space:nowrap;letter-spacing:.06em}
.tag.cream{background:var(--cream)}
.tag.olive{background:var(--olive)}
.tag.yellow{background:var(--yellow)}
.tag.ink{background:var(--ink);color:var(--paper)}
.tag.self{background:var(--sky)}
.tag.fama{background:var(--orange)}
.tag.photo{background:var(--red);border-color:var(--red);color:var(--paper)}
.tag.clash{background:var(--paper);border-color:var(--red);color:var(--red);font-weight:700}
button.tag{cursor:pointer;font:inherit;font-size:12px}

.seg{display:inline-flex;border:var(--line);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0}
.seg button{border:0;background:var(--paper);padding:4px 12px;font-size:14px;color:var(--muted)}
.seg button+button{border-left:var(--line)}
.seg button.on-att{background:var(--yellow);color:var(--ink);font-weight:700}
.seg button.on-leave{background:var(--cream);color:var(--ink);font-weight:700}

.datebar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.datebar input{flex:1;min-width:0;padding:5px 12px;border:var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink)}
.datebar .btn{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:18px}
.label{font-size:13px;letter-spacing:.2em;color:var(--ink);margin:24px 2px 10px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.label .en{font-size:10px;letter-spacing:.3em;color:var(--muted);font-weight:400;text-transform:uppercase}

.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:10px 14px}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.stat .v{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.total{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--yellow);padding:14px 16px}
.stat.total .k{color:var(--ink)}
.stat.total .v{font-size:30px}
.stat.total.red{background:var(--red);border-color:var(--red)}
.stat.total.red .k,.stat.total.red .v{color:var(--paper)}
.sq{display:inline-block;width:10px;height:10px;border:1.5px solid var(--ink);border-radius:3px;flex-shrink:0}
.bar{display:flex;height:14px;border:var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--paper);margin-top:10px}
.bar span{display:block;height:100%}
.bar span+span{border-left:1.5px solid var(--ink)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 14px;text-align:left;border-top:1px solid var(--hair)}
thead th{border-top:0;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.1em}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--cream);font-weight:700;color:var(--ink);border-top:1.5px solid var(--ink)}
.tblwrap{overflow-x:auto}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px;line-height:1.8}

/* pixel icons */
.px{flex-shrink:0;display:block;overflow:visible}
.tile{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:10px;background:var(--cream)}
.tile.self{background:var(--sky)}
.tile.fama{background:var(--orange)}
.tile.paper{background:var(--paper)}
.time{width:44px;flex-shrink:0;text-align:center;font-weight:700;color:var(--ink);font-size:14px;line-height:1.25}
.bigdate{width:52px;flex-shrink:0;text-align:center;color:var(--ink);line-height:1.1}
.bigdate b{display:block;font-size:20px;font-weight:700;letter-spacing:0}
.bigdate small{font-size:11px;color:var(--muted)}
.time small{display:block;font-weight:400;color:var(--muted);font-size:11px}

/* calendar */
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calhead div{text-align:center;font-size:12px;color:var(--muted);padding:6px 0;letter-spacing:.1em}
.calgrid{border-top:var(--line)}
.day{position:relative}
.day{border:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--paper);min-height:62px;padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.day:nth-child(7n){border-right:0}
.day.out{background:transparent;cursor:default}
.day .d{font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--ink)}
.day.sun .d{color:var(--muted)}
.day.today .d{background:var(--ink);color:var(--paper);font-weight:700}
.day.sel{background:var(--cream)}
.day.sel .d{outline:2px solid var(--ink)}
.marks{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.mk{width:8px;height:8px;border:1px solid var(--ink);border-radius:2px;display:inline-block}
.mk.s{background:var(--sky)}
.mk.f{background:var(--orange)}
.mk.r{background:var(--red);border-color:var(--red)}
.bang{position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:var(--red);color:var(--paper);font-size:10px;font-weight:700;line-height:14px;text-align:center}
.clashbox{border:1.5px solid var(--red);border-radius:var(--r);padding:10px 14px;color:var(--red);background:var(--paper);display:flex;flex-direction:column;gap:4px;font-size:14px}
.clashbox b{letter-spacing:.1em}
.clashbox button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.clashbox button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:6px;align-items:center}
.mat input[type=text]{padding:4px 8px;border:var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);width:100%;font-size:14px}
.mat label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.matline{font-size:12px;color:var(--brown);margin-top:1px}
.matline b{font-weight:500;color:var(--muted);margin-right:4px}
.more{font-size:10px;line-height:8px;color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 2px 0}
.legend span{display:flex;align-items:center;gap:5px}


/* calendar views */
.calbar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.calrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.caltitle{font-size:19px;color:var(--ink);letter-spacing:.08em;min-width:0;font-variant-numeric:tabular-nums}
.sq-btn{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:18px}
.viewseg button{padding:4px 16px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:var(--line)}
.mcell{border:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--paper);min-height:92px;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;min-width:0;overflow:hidden;font:inherit}
.mcell:nth-child(7n){border-right:0}
.mcell.out{background:transparent}
.mcell.sel{background:var(--cream)}
.mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:1px}
.mcell .d{font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--ink);font-variant-numeric:tabular-nums}
.mcell.sun .d{color:var(--muted)}
.mcell.today .d{background:var(--ink);color:var(--paper);font-weight:700}
.mcell .bang{position:static}
.chip{display:block;font-size:11px;line-height:1.35;padding:1px 4px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);border:0;text-align:left;font-family:inherit;max-width:100%}
.chip b{font-weight:700;margin-right:3px;font-variant-numeric:tabular-nums}
.c-self{background:var(--sky)}
.c-fama{background:var(--orange)}
.c-photo,.blk.c-photo,.chip.c-photo{background:var(--red);color:var(--paper)}
.blk.c-photo b,.blk.c-photo span{color:var(--paper)}
.c-score{background:var(--yellow)}
.c-off{opacity:.45;text-decoration:line-through}
.morechip{font-size:10px;color:var(--muted);padding-left:4px}
@media (max-width:480px){.mcell{min-height:74px}.chip{font-size:10px;padding:0 3px}.chip b{display:none}}
.tg{overflow:hidden}
.tg-head,.tg-all{display:grid;grid-template-columns:44px repeat(var(--cols),minmax(0,1fr));border-bottom:var(--line)}
.tg-day{border:0;background:var(--paper);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font:inherit;color:var(--muted);font-size:12px;min-width:0}
.tg-day b{font-size:17px;color:var(--ink);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.tg-day.today b{background:var(--ink);color:var(--paper)}
.tg-day.sel{background:var(--cream)}
.tg-all{border-bottom:1px solid var(--hair)}
.tg-lab{font-size:11px;color:var(--muted);display:grid;place-items:center}
.tg-allcell{padding:3px 2px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--hair)}
.tg-body{display:grid;grid-template-columns:44px repeat(var(--cols),minmax(0,1fr));position:relative;overflow:hidden}
.tg-hours{position:relative}
.tg-hours span{position:absolute;right:6px;font-size:10px;color:var(--muted);transform:translateY(-1px);font-variant-numeric:tabular-nums}
.tg-col{position:relative;border-left:1px solid var(--hair);background-image:repeating-linear-gradient(to bottom,var(--hair) 0 1px,transparent 1px var(--hour));min-width:0}
.tg-col.today{background-color:rgba(242,196,106,.12)}
.blk{position:absolute;border:0;border-radius:6px;padding:2px 4px;font:inherit;font-size:11px;line-height:1.3;text-align:left;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(62,58,57,.35)}
.blk b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.blk span{overflow:hidden;text-overflow:ellipsis}
.tg.one .blk{font-size:13px;padding:4px 8px}
.nowline{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--red)}
.nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;width:7px;height:7px;border-radius:50%;background:var(--red)}
/* student page */
.back{padding-left:0;margin-bottom:8px;color:var(--ink)}
.stuhead{display:flex;gap:14px;align-items:flex-start;padding:16px;flex-wrap:wrap}
.stuhead .main{flex:1;min-width:200px}
.tile.big{width:64px;height:64px;border-radius:14px}
.inline{padding:5px 9px;border:var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);font-size:14px;min-width:0}
.mat-row .inline{width:min(160px,34vw)}
.addrow{gap:8px;flex-wrap:wrap}
.addrow .inline{flex:1 1 110px}
.pfield{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.addrow .pfield .inline{flex:none}
.chev{font-size:20px;color:var(--muted);flex-shrink:0}
.contact{color:var(--brown)}
.tag.ig{background:var(--paper);text-decoration:none}
a.tag:hover{background:var(--cream)}
.stutop{display:flex;gap:14px;align-items:center}
.editbtn{margin-left:auto;align-self:flex-start;padding:3px 12px;font-size:13px}
.infogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.infogrid .k{font-size:12px;color:var(--muted);letter-spacing:.08em}
.infogrid .v{font-size:15px;color:var(--ink);font-weight:700;margin-top:1px;overflow-wrap:anywhere}
.sechead{margin:24px 2px 10px}
.morebtn{display:block;width:100%;border:0;border-top:1px solid var(--hair);background:none;padding:11px;font:inherit;font-size:13px;color:var(--ink);letter-spacing:.06em}
.stuhead{display:block!important}
.period{margin-bottom:10px;overflow:hidden}
.period .ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.period .ph.click{cursor:pointer}
.period.unpaid .ph{background:var(--cream)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 14px 14px}
.period.unpaid .slots{padding-top:12px}
.slot{border:1.5px solid var(--ink);border-radius:8px;padding:6px 2px;text-align:center;font-size:12px;line-height:1.35;color:var(--ink)}
.slot b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.slot.done{background:var(--yellow)}
.slot.leave{background:var(--cream);color:var(--muted)}
.slot.todo{border-style:dashed;color:var(--muted)}
.slot.todo b{color:var(--muted);font-weight:500}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.leaveopt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;background:var(--paper);font:inherit;color:var(--ink)}
.leaveopt b{font-size:15px}
.leaveopt span{font-size:12px;color:var(--muted)}
.leaveopt.free{background:var(--cream)}
.leaveopt.charged{background:var(--yellow)}
.leaveopt.charged span{color:var(--brown)}
.leaveopt.on{outline:2px solid var(--ink);outline-offset:2px}
.slot.charged{background:var(--yellow);background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,252,246,.55) 5px 9px)}
.remind .tuitionmsg{border-top:1px solid rgba(62,58,57,.25);padding-top:8px;margin-top:4px;display:flex;flex-direction:column;gap:6px}
.msgtxt{background:var(--paper);border:1.5px dashed var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6;color:var(--ink);user-select:text;-webkit-user-select:text}
.clashbox .between{gap:8px}
.vacbox{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;width:100%;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--cream);padding:10px 14px;font:inherit;font-size:14px;color:var(--ink);text-align:left}
.vacbox.ok{background:var(--paper)}
.vaclist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mcell.vac{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(174,172,120,.18) 6px 10px)}
.vactag{font-size:10px;color:var(--paper);background:var(--olive);border-radius:4px;padding:0 3px;line-height:14px}
.mk.v{background:var(--olive)}
.vachead{padding:16px}
.vacrow{padding:12px 14px}
.vacrow+.vacrow{border-top:1px solid var(--hair)}
.vacacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.vacacts .btn{padding:6px 0}
.c-due{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--red);color:var(--red)}
.searchbox{margin:10px 0 2px}
.searchbox .inline{width:100%}
.yearchart{padding:14px 10px 6px;margin-top:10px}
.ybars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:150px;align-items:end}
.ybar{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:stretch;height:100%;font:inherit}
.ystack{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.ystack i{display:block;border:1px solid var(--ink);border-bottom:0}
.ystack i:first-child{border-radius:3px 3px 0 0}
.ystack i:last-child{border-bottom:1px solid var(--ink)}
.ybar small{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
.ybar.now small{color:var(--ink);font-weight:700}
.cics{display:flex;gap:6px;flex-shrink:0}
.cic{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:8px;display:grid;place-items:center;background:var(--paper);padding:0;cursor:pointer}
.tile.private{background:var(--hair)}
.c-private{background:var(--hair);color:var(--ink)}
.blk.c-private{background:var(--hair)}
.mast .issue .sub2{gap:8px}
/* nav with raised calendar key */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:var(--line);display:flex;justify-content:center;align-items:flex-end;
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs button{flex:1;max-width:120px;border:0;background:none;padding:4px 2px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:var(--r-sm);letter-spacing:.1em}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button .ic{display:grid;place-items:center;width:40px;height:32px;opacity:.55;transition:opacity .15s}
nav.tabs button.on .ic{opacity:1}
nav.tabs button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink);margin-top:1px}
nav.tabs button:not(.on)::after{content:"";width:5px;height:5px;margin-top:1px}
nav.tabs button.mid::after{display:none}
nav.tabs button.mid{flex:0 0 auto;width:84px;max-width:none}
nav.tabs button.mid .key{width:62px;height:62px;margin-top:-30px;background:var(--cream);border:var(--line);border-radius:18px;display:grid;place-items:center}
nav.tabs button.mid.on .key{background:var(--yellow)}


dialog{border:var(--line);border-radius:18px;background:var(--paper);color:var(--brown);padding:0;width:min(440px,calc(100vw - 32px));max-height:86vh}
dialog::backdrop{background:rgba(62,58,57,.4)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);letter-spacing:.08em}
.field input,.field select,.field textarea{padding:0 12px;height:44px;border:var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);font-size:16px;width:100%;min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none;font-family:inherit;line-height:44px}
.field textarea{height:auto;line-height:1.5;padding:8px 12px}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field input[type=date],.field input[type=time],.field input[type=month]{text-align:left}
.field input::-webkit-date-and-time-value{text-align:left;margin:0}
.field input::-webkit-datetime-edit{padding:0}
.inline,.datebar input{font-size:16px!important}
.inline{height:38px;-webkit-appearance:none;appearance:none;font-family:inherit}
.datebar input{height:38px;-webkit-appearance:none;appearance:none;font-family:inherit;text-align:center}
.grid2>*{min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days label{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%!important;border:var(--line);border-radius:var(--r-sm);color:var(--ink);cursor:pointer;background:var(--paper)}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){background:var(--yellow);font-weight:700}
.days label:has(input:focus-visible){outline:3px solid var(--yellow);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:var(--r-sm);font-size:14px;z-index:40;max-width:calc(100vw - 32px)}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
.tile.score{background:var(--yellow)}
.remind{border:1.5px solid var(--ink);background:var(--yellow);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink)}
.remind b{letter-spacing:.1em}
.remind button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.remind button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.late{display:inline-block;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 7px;font-size:11px;margin-right:6px;text-decoration:none}
.paycol{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
@media (max-width:540px){.item.wrapline{flex-wrap:wrap}.item.wrapline .main{flex-basis:calc(100% - 110px)}.item.wrapline .acts{width:100%;justify-content:flex-end}}

.clashnote{font-size:13px;color:var(--red);border:1.5px solid var(--red);border-radius:var(--r-sm);padding:6px 10px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes riseT{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  dialog[open]{animation:rise .26s cubic-bezier(.2,.7,.25,1) both}
  dialog[open]::backdrop{animation:fade .22s ease both}
  .toast:not([hidden]){animation:riseT .24s cubic-bezier(.2,.7,.25,1) both}
}
@media (min-width:900px){.wrap{max-width:860px}.summary.wide{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
@media (max-width:420px){.day{min-height:54px}.time{width:38px}.item{gap:10px;padding:11px 12px}}

function todayISO(){return iso(new Date())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function md(s){const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()}
const mdw=s=>`${md(s)}（${WD[parse(s).getDay()]}）`;
function money(n){const v=Math.round(n||0);return (v<0?'−$':'$')+Math.abs(v).toLocaleString('en-US')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const ST=id=>S.students.find(s=>s.id===id);
function ym(m){const [y,mm]=m.split('-');return `${y} 年 ${+mm} 月`}
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
async function put(col,id,data){if(!db){toast('尚未連線，無法儲存');return}try{await db.collection(col).doc(id).set(data)}catch(e){toast('儲存失敗：'+(e.message||e.code))}}
async function patch(col,id,data){if(!db)return;try{await db.collection(col).doc(id).update(data)}catch(e){toast('儲存失敗：'+(e.message||e.code))}}
async function del(col,id){if(!db)return;try{await db.collection(col).doc(id).delete()}catch(e){toast('刪除失敗：'+(e.message||e.code))}}

/* ---------- schedule ---------- */
const weekStart=d=>{const x=parse(d);x.setDate(x.getDate()-x.getDay());return x};
/* does this student have a regular lesson on date d? weekly, or every other week counted from startDate */
function occurs(s,d){
  if(s.active===false||!(s.days||[]).includes(parse(d).getDay()))return false;
  if(s.startDate&&d<s.startDate)return false;
  if(s.freq==='biweekly'){const w=Math.round((weekStart(d)-weekStart(s.startDate||d))/(7*864e5));return w%2===0}
  return true;
}
const freqLabel=s=>s.freq==='biweekly'?'隔週':'每週';
/* everything on one day */
function eventsOn(d){
  const ev=[]; const seen=new Set();
  for(const l of S.lessons){ if(l.date!==d)continue;
    if(l.kind){ev.push({k:'extra',time:l.time||'',l});continue}
    const s=ST(l.studentId); seen.add(l.studentId); if(l.status==='moved')continue; ev.push({k:'lesson',time:s?.time||'',s,l});
  }
  if(d>=todayISO())for(const s of S.students)if(!seen.has(s.id)&&occurs(s,d))ev.push({k:'lesson',time:s.time||'',s,l:null});
  for(const i of S.income)if(i.type==='photo'&&i.date===d)ev.push({k:'shoot',time:i.time||'',i});
  for(const s of S.students)for(const sc of (s.scores||[]))if(sc.date===d)ev.push({k:'score',time:'',s,sc});
  for(const i of S.income)if(i.type==='photo'&&!i.delivered&&dueOf(i)===d)ev.push({k:'due',time:'',i});
  for(const p of S.personal)if(p.date===d)ev.push({k:'personal',time:p.allDay?'':(p.time||''),p});
  return ev.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}
const extraName=l=>l.studentId?(ST(l.studentId)?.name||'（已刪除的學生）'):(l.name||'試上');
/* time spans on a day, for clash checks */
function spansOn(d){
  const out=[];
  for(const e of eventsOn(d)){
    if(e.k==='score'||e.k==='due')continue;
    if(e.k==='personal'){const p=e.p;if(p.allDay){out.push({key:p.id,kind:'personal',s:0,end:1440,label:p.title||'私人行程'});continue}
      const s=toMin(p.time);if(s==null)continue;const en=toMin(p.endTime);out.push({key:p.id,kind:'personal',s,end:en>s?en:s+60,label:p.title||'私人行程'});continue}
    if(e.k==='shoot'){const s=toMin(e.i.time);if(s==null)continue;const en=toMin(e.i.endTime);out.push({key:e.i.id,kind:'shoot',s,end:en>s?en:s+60,label:e.i.title||'拍攝'});continue}
    const l=e.l; if(l&&(isLeave(l.status)||l.status==='moved'))continue;
    const s=toMin(e.time); if(s==null)continue;
    const mins=+(l?.minutes??e.s?.minutes??src(e.s).def)||60;
    out.push({key:e.k==='extra'?l.id:e.s?.id,kind:'lesson',s,end:s+mins,label:e.k==='extra'?extraName(l):(e.s?.name||'學生')});
  }
  return out;
}
function clashesOn(d){const sp=spansOn(d),out=[];for(let i=0;i<sp.length;i++)for(let j=i+1;j<sp.length;j++)if(sp[i].s<sp[j].end&&sp[j].s<sp[i].end)out.push({a:sp[i],b:sp[j]});return out}
function clashFor(d,start,end,excludeKey){const s=toMin(start);if(!d||s==null)return [];const e=toMin(end)>s?toMin(end):s+60;return spansOn(d).filter(x=>x.key!==excludeKey&&x.s<e&&s<x.end)}
function upcomingClashes(days=60){const out=[];let d=todayISO();for(let i=0;i<days;i++){for(const c of clashesOn(d))out.push({d,...c});d=addDays(d,1)}return out}
const spanTxt=x=>`${esc(x.label)} ${hm(x.s)}–${hm(x.end)}`;
const clashTxt=c=>`${spanTxt(c.a)} ↔ ${spanTxt(c.b)}`;
/* sheet music to bring: due within a week, or overdue and not yet brought */
function scoreReminders(){const t=todayISO(),lim=addDays(t,7),out=[];for(const s of S.students)for(const sc of (s.scores||[]))if(!sc.brought&&sc.date&&sc.date<=lim)out.push({s,sc});return out.sort((a,b)=>a.sc.date.localeCompare(b.sc.date))}
const scoresFor=(s,d)=>(s?.scores||[]).filter(sc=>sc.date===d||(!sc.brought&&sc.date&&sc.date<d));

/* ---------- money ---------- */
const shootDue=i=>i.paid?0:Math.max(0,(+i.amount||0)-(!i.noDeposit&&i.depositPaid?(+i.deposit||DEPOSIT):0));
function monthCalc(m){
  const r={teach:0,photo:0,other:0,rows:[],others:[],photos:[],scores:[],bySrc:{}};
  const by={};
  for(const l of S.lessons){
    if(!counts(l.status)||!l.date.startsWith(m))continue;
    const fee=+l.fee||0; r.teach+=fee;
    const stu=ST(l.studentId); const source=l.source||stu?.source||'self';
    const key=l.studentId||('trial:'+(l.name||''));
    by[key]=by[key]||{name:l.studentId?(stu?.name||'（已刪除的學生）'):(l.name||'試上'),trial:l.kind==='trial',source,n:0,fee:0,mins:0};
    by[key].n++;by[key].fee+=fee;by[key].mins+=+l.minutes||0;
    r.bySrc[source]=(r.bySrc[source]||0)+fee;
  }
  r.rows=Object.values(by).sort((a,b)=>b.fee-a.fee);
  for(const i of S.income){if(!i.date||!i.date.startsWith(m))continue;
    if(i.type==='photo'){r.photo+=+i.amount||0;r.photos.push(i)}else{r.other+=+i.amount||0;r.others.push(i)}}
  for(const s of S.students)for(const sc of (s.scores||[]))if(sc.paid&&(sc.date||'').startsWith(m)){r.other+=+sc.price||0;r.scores.push({s,sc})}
  const byDate=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
  r.others.sort(byDate);r.photos.sort(byDate);
  r.total=r.teach+r.photo+r.other;
  return r;
}
function balance(sid){
  const pays=S.payments.filter(p=>p.studentId===sid);
  if(!pays.length)return null;
  const paid=pays.reduce((a,p)=>a+(+p.lessons||0),0);
  const used=S.lessons.filter(l=>l.studentId===sid&&counts(l.status)&&l.kind!=='trial').length;
  return paid-used;
}

function reminderBoxes(){
  let h='';
  const up=upcomingClashes();
  if(up.length)h+=`<div class="clashbox"><b>！接下來 60 天有 ${up.length} 個撞期</b>${up.slice(0,8).map(c=>`<button data-act="jump" data-d="${c.d}">${mdw(c.d)} ${clashTxt(c)}</button>`).join('')}${up.length>8?`<span>…還有 ${up.length-8} 個</span>`:''}</div>`;
  const sr=scoreReminders();
  if(sr.length)h+=`<div class="remind"><b>帶譜提醒</b>${sr.map(x=>`<button data-act="jump" data-d="${x.sc.date}">${x.sc.date<todayISO()?'<span class="late">已過期</span>':''}${mdw(x.sc.date)} 帶「${esc(x.sc.title||'樂譜')}」給 ${esc(x.s.name)}${x.sc.paid?'':`，跟家長收 ${money(x.sc.price)}`}</button>`).join('')}</div>`;
  return h?`<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">${h}</div>`:'';
}

const CAL_VIEWS={month:'月',week:'週',day:'日'};
function evMeta(e){
  /* label, colour class, time span, action for a calendar event */
  if(e.k==='shoot'){const s=toMin(e.i.time),en=toMin(e.i.endTime);return {cls:'c-photo',label:e.i.title||'拍攝',s,end:s==null?null:(en>s?en:s+60),act:`data-act="editIncome" data-id="${e.i.id}"`}}
  if(e.k==='personal'){const p=e.p,s=p.allDay?null:toMin(p.time),en=toMin(p.endTime);return {cls:'c-private',label:(p.title||'私人行程'),s,end:s==null?null:(en>s?en:s+60),act:`data-act="editPersonal" data-id="${p.id}"`}}
  if(e.k==='due')return {cls:'c-due',label:'交件：'+(e.i.title||'拍攝'),s:null,act:`data-act="editIncome" data-id="${e.i.id}"`};
  if(e.k==='score')return {cls:'c-score',label:'帶譜：'+(e.sc.title||'樂譜')+'（'+e.s.name+'）',s:null,act:`data-act="editScore" data-sid="${e.s.id}" data-scid="${e.sc.id}"`};
  const l=e.l, stu=e.k==='extra'?ST(l.studentId):e.s; const so=l?.source||stu?.source;
  const s=toMin(e.time); const mins=+(l?.minutes??stu?.minutes??src(stu).def)||60;
  const off=l&&(isLeave(l.status)||l.status==='moved');
  const name=e.k==='extra'?extraName(l)+(l.kind==='trial'?'（試上）':l.kind==='moved'?'（調課）':'（補課）'):(stu?.name||'學生');
  return {cls:(so==='fama'?'c-fama':'c-self')+(off?' c-off':''),label:name+(l?.status==='leaveCharged'?'・請假扣堂':l?.status==='leave'?'・請假':''),s,end:s==null?null:s+mins,act:stu?`data-act="openStudent" data-id="${stu.id}"`:`data-act="goSign" data-d="${l?.date||''}"`};
}
function calTitle(){
  const d=parse(calSel);
  if(calView==='month')return `${d.getFullYear()} 年 ${d.getMonth()+1} 月`;
  if(calView==='week'){const a=iso(weekStart(calSel)),b=addDays(a,6);return `${md(a)} – ${md(b)}`}
  return `${d.getMonth()+1} 月 ${d.getDate()} 日（${WD[d.getDay()]}）`;
}
function monthGrid(){
  const [y,m]=calSel.slice(0,7).split('-').map(Number);
  const days=new Date(y,m,0).getDate(), off=new Date(y,m-1,1).getDay(), today=todayISO();
  let cells='';
  for(let i=0;i<off;i++)cells+='<div class="mcell out"></div>';
  for(let d=1;d<=days;d++){
    const ds=iso(new Date(y,m-1,d)); const ev=eventsOn(ds); const cl=clashesOn(ds).length;
    const chips=ev.map(e=>{const x=evMeta(e);return `<span class="chip ${x.cls}">${x.s!=null?`<b>${hm(x.s)}</b>`:''}${esc(x.label)}</span>`});
    const vac=vacOn(ds);
    cells+=`<button class="mcell ${vac?'vac':''} ${ds===today?'today':''} ${ds===calSel?'sel':''} ${new Date(y,m-1,d).getDay()===0?'sun':''}" data-act="pick" data-d="${ds}" aria-label="${m}月${d}日，${ev.length} 個行程${cl?'，有撞期':''}">
      <span class="mtop"><span class="d">${d}</span>${cl?'<span class="bang">!</span>':vac?'<span class="vactag">休</span>':''}</span>${chips.slice(0,3).join('')}${chips.length>3?`<span class="morechip">還有 ${chips.length-3} 個</span>`:''}</button>`;
  }
  const rest=(7-(off+days)%7)%7;for(let i=0;i<rest;i++)cells+='<div class="mcell out"></div>';
  return `<div class="panel" style="overflow:hidden"><div class="calhead">${WD.map(w=>`<div>${w}</div>`).join('')}</div><div class="mgrid">${cells}</div></div>`;
}
function timeGrid(dates){
  const HOUR=48, today=todayISO();
  const cols=dates.map(d=>{const ev=eventsOn(d);const timed=[],allday=[];
    for(const e of ev){const x=evMeta(e);(x.s!=null?timed:allday).push({e,x})}
    return {d,timed,allday,clash:clashesOn(d).length}});
  let lo=8*60,hi=21*60;
  for(const c of cols)for(const t of c.timed){lo=Math.min(lo,Math.floor(t.x.s/60)*60);hi=Math.max(hi,Math.ceil(t.x.end/60)*60)}
  const H=(hi-lo)/60*HOUR;
  /* side-by-side lanes for overlapping blocks */
  for(const c of cols){
    const items=c.timed.sort((a,b)=>a.x.s-b.x.s);let cluster=[],ends=[],cEnd=-1;
    const flush=()=>{cluster.forEach(it=>it.n=ends.length);cluster=[];ends=[]};
    for(const it of items){
      if(it.x.s>=cEnd)flush();
      let lane=ends.findIndex(e=>e<=it.x.s);if(lane<0){lane=ends.length;ends.push(0)}
      ends[lane]=it.x.end;it.lane=lane;cluster.push(it);cEnd=Math.max(cEnd,it.x.end);
    }
    flush();
  }
  const one=dates.length===1;
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  let h=`<div class="panel tg ${one?'one':''}" style="--cols:${dates.length};--hour:${HOUR}px">
    <div class="tg-head"><div></div>${cols.map(c=>{const dd=parse(c.d);return `<button class="tg-day ${c.d===today?'today':''} ${c.d===calSel?'sel':''}" data-act="pick" data-d="${c.d}"><span>${WD[dd.getDay()]}</span><b>${dd.getDate()}</b>${c.clash?'<i class="bang" style="position:static">!</i>':''}</button>`}).join('')}</div>`;
  if(cols.some(c=>c.allday.length))h+=`<div class="tg-all"><div class="tg-lab">全天</div>${cols.map(c=>`<div class="tg-allcell">${c.allday.map(t=>`<button class="chip ${t.x.cls}" ${t.x.act}>${esc(t.x.label)}</button>`).join('')}</div>`).join('')}</div>`;
  h+=`<div class="tg-body" style="height:${H}px"><div class="tg-hours">${Array.from({length:(hi-lo)/60},(_,i)=>`<span style="top:${i*HOUR}px">${hm(lo+i*60)}</span>`).join('')}</div>`;
  h+=cols.map(c=>`<div class="tg-col ${c.d===today?'today':''}">${c.timed.map(t=>{const top=(t.x.s-lo)/60*HOUR,ht=Math.max((t.x.end-t.x.s)/60*HOUR-2,20),w=100/t.n;
      return `<button class="blk ${t.x.cls}" ${t.x.act} style="top:${top}px;height:${ht}px;left:calc(${t.lane*w}% + 1px);width:calc(${w}% - 2px)"><b>${hm(t.x.s)}${one?'–'+hm(t.x.end):''}</b><span>${esc(t.x.label)}</span></button>`}).join('')}
      ${c.d===today&&nowMin>=lo&&nowMin<=hi?`<i class="nowline" style="top:${(nowMin-lo)/60*HOUR}px"></i>`:''}</div>`).join('');
  return h+'</div></div>';
}

/* next lessons still to come: pending moved/makeup lessons plus regular days (moved-away and leave days skipped) */
function upcomingLessons(s,n){
  const t=todayISO(),out=[];
  const pend=S.lessons.filter(l=>l.studentId===s.id&&l.kind&&l.kind!=='trial'&&!counts(l.status)&&!isLeave(l.status)&&l.date>=t).map(l=>({date:l.date,kind:l.kind}));
  const taken=new Set(S.lessons.filter(l=>l.studentId===s.id&&(l.kind||l.status)).map(l=>l.date));
  let d=t;for(let i=0;i<120&&out.length<n+pend.length;i++){if(occurs(s,d)&&!taken.has(d))out.push({date:d});d=addDays(d,1)}
  return out.concat(pend).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n);
}
/* tuition periods: each payment opens a period of N lessons; attended lessons fill periods in date order,
   leaves sit in the period they happened in without using it up, lessons past the paid ones form unpaid periods */
let openPeriods=new Set();
function tuitionPeriods(s){
  const pays=S.payments.filter(p=>p.studentId===s.id).sort((a,b)=>a.date.localeCompare(b.date));
  const evs=S.lessons.filter(l=>l.studentId===s.id&&l.kind!=='trial'&&(counts(l.status)||l.status==='leave')).sort((a,b)=>a.date.localeCompare(b.date));
  const per=pays.map((p,i)=>({no:i+1,pay:p,cap:+p.lessons||4,used:0,slots:[]}));
  const unpaid=[];let pi=0;
  const cur=()=>{
    while(pi<per.length&&per[pi].used>=per[pi].cap)pi++;
    if(pi<per.length)return per[pi];
    let u=unpaid[unpaid.length-1];
    if(!u||u.used>=u.cap){u={no:per.length+unpaid.length+1,pay:null,cap:4,used:0,slots:[]};unpaid.push(u)}
    return u;
  };
  /* advance-notice leaves don't take a slot; they're listed under the period they fell in */
  let freeHold=[];
  const peek=()=>{let i=pi;while(i<per.length&&per[i].used>=per[i].cap)i++;if(i<per.length)return per[i];const u=unpaid[unpaid.length-1];return u&&u.used<u.cap?u:null};
  for(const l of evs){
    if(l.status==='leave'){const p=peek();if(p)(p.free=p.free||[]).push(l);else freeHold.push(l);continue}
    const p=cur();if(freeHold.length){(p.free=p.free||[]).push(...freeHold);freeHold=[]}
    p.slots.push({l});p.used++;
  }
  /* upcoming lessons fill the open period; if every paid period is used up, show the next one as unpaid */
  const all=per.concat(unpaid);
  let open=all.find(p=>p.used<p.cap&&(p.pay||p.used>0));
  if(!open&&s.active!==false&&(s.days||[]).length){open={no:all.length+1,pay:null,cap:4,used:0,slots:[],upcomingOnly:true};unpaid.push(open);all.push(open)}
  if(open){
    const need=open.cap-open.used;
    open.slots.push(...upcomingLessons(s,need).map(u=>({date:u.date,kind:u.kind})));
  }
  return all.reverse();
}
function periodCard(s,p,first){
  const unpaidP=!p.pay;
  const done=p.slots.filter(x=>x.l&&counts(x.l.status));
  const full=!unpaidP&&p.used>=p.cap;
  const open=first||unpaidP||!full||openPeriods.has(p.pay?.id);
  const range=done.length?`${md(done[0].l.date)} – ${md(done[done.length-1].l.date)}`:'';
  const sub=unpaidP?(p.used?`已經上了 ${p.used} 堂，記得收 ${money(s.fee*p.cap)}`:`下一堂前記得收 ${money(s.fee*p.cap)}`)
    :`${md(p.pay.date)} 繳費・${money(p.pay.amount)}${full&&range?'・'+range:''}`;
  const pill=unpaidP?'<span class="tag ink">需繳費</span>':full?`<span class="tag yellow">${p.cap} 堂上完</span>`:`<span class="tag cream">上到 ${p.used} / ${p.cap}</span>`;
  const head=`<div class="ph ${full&&!first?'click':''}" ${full&&!first?`data-act="togglePeriod" data-id="${p.pay.id}"`:''}>
    <div class="main"><div class="name" style="cursor:inherit">第 ${p.no} 期${unpaidP?'・尚未繳費':''}</div><div class="sub">${sub}</div></div>${pill}
    ${full&&!first?`<span class="chev" aria-hidden="true">${open?'⌃':'⌄'}</span>`:''}</div>`;
  if(!open)return `<div class="panel period">${head}</div>`;
  const slots=p.slots.map(x=>x.l?`<div class="slot ${x.l.status==='leaveCharged'?'charged':'done'}"><b>${md(x.l.date)}</b>${x.l.status==='leaveCharged'?'請假扣堂':x.l.kind==='moved'?'調課':x.l.kind==='makeup'?'補課':'出席'}</div>`:`<div class="slot todo"><b>${md(x.date)}</b>${x.kind==='moved'?'調課・待上':x.kind==='makeup'?'補課・待上':'待上'}</div>`).join('');
  const del=p.pay?`<button class="linkbtn" data-act="delPay" data-id="${p.pay.id}">刪除這筆繳費</button>`:'';
  const freeNote=(p.free||[]).length?`<div class="sub" style="padding:0 14px 10px">提早請假：${p.free.map(l=>md(l.date)).join('、')}（不扣堂）</div>`:'';
  return `<div class="panel period ${unpaidP?'unpaid':''}">${head}<div class="slots">${slots||'<div class="sub" style="grid-column:1/-1">還沒有排到課</div>'}</div>${freeNote}${del?`<div style="padding:0 14px 10px;text-align:right">${del}</div>`:''}</div>`;
}
function tuitionSection(s){
  const per=tuitionPeriods(s);

  return h+per.map((p,i)=>periodCard(s,p,i===0)).join('');
}

function viewPhoto(){
  const r=monthCalc(month); const y=month.slice(0,4);
  const yearSum=S.income.filter(i=>i.type==='photo'&&i.date?.startsWith(y)).reduce((a,i)=>a+(+i.amount||0),0);
  const unpaid=S.income.filter(i=>i.type==='photo'&&!i.paid&&shootDue(i)>0);
  const unpaidSum=unpaid.reduce((a,i)=>a+shootDue(i),0);
  const noDep=S.income.filter(i=>i.type==='photo'&&!i.paid&&!i.noDeposit&&!i.depositPaid&&i.date>=todayISO()).length;
  let h=monthBar()+`<div class="summary">
    <div class="panel stat total red"><div class="k">${ym(month)} 攝影收入 · ${r.photos.length} 件</div><div class="v">${money(r.photo)}</div></div>
    <div class="panel stat"><div class="k">${y} 年累計</div><div class="v">${money(yearSum)}</div></div>
    <div class="panel stat"><div class="k">待收款 · ${unpaid.length} 件${noDep?`（${noDep} 件未收定金）`:''}</div><div class="v">${money(unpaidSum)}</div></div>
  </div>
  <div class="between"><div class="label">本月拍攝<span class="en">shoots</span></div><button class="btn primary" data-act="newPhoto">＋ 新增拍攝</button></div><div class="panel list">`;
  if(!r.photos.length)h+='<div class="empty">這個月還沒有拍攝紀錄。排好的拍攝也可以先記，日期和時間會顯示在行事曆上。</div>';
  h+=r.photos.map(i=>shootRow(i)).join('')+'</div>';
  const otherUnpaid=unpaid.filter(i=>!i.date?.startsWith(month));
  if(otherUnpaid.length)h+='<div class="label">其他月份待收款<span class="en">unpaid</span></div><div class="panel list">'+otherUnpaid.sort((a,b)=>a.date.localeCompare(b.date)).map(i=>shootRow(i)).join('')+'</div>';

  }</tbody></table>`:'<div class="empty">這個月沒有出席紀錄</div>';
  h+=`</div><div class="label">攝影 · ${r.photos.length} 件<span class="en">photo</span></div><div class="panel list">`;
  h+=r.photos.length?`<div class="item">${camTile()}<div class="main sub">明細在「攝影」分頁</div><button class="btn" data-act="goPhoto">查看</button><span class="num" style="font-weight:700;color:var(--ink)">${money(r.photo)}</span></div>`:'<div class="empty">這個月沒有攝影收入</div>';

  const rows=r.others.map(otherRow).concat(r.scores.map(x=>`<div class="item"><div class="main"><div class="name" data-act="editScore" data-sid="${x.s.id}" data-scid="${x.sc.id}">譜費：${esc(x.sc.title||'樂譜')}</div><div class="row sub"><span>${md(x.sc.date)}</span><span>${esc(x.s.name)}</span></div></div><span class="num" style="font-weight:700;color:var(--ink)">${money(x.sc.price)}</span></div>`));
  h+=rows.length?rows.join(''):'<div class="empty">租琴房、賣琴、學生音樂會、教材費都記在這裡。支出填負數。已收的譜費也會自動列在這裡。</div>';
  return h+'</div><div class="between" style="margin-top:28px"><span class="sub">資料會自動同步到雲端。想多留一份在手機或電腦，可以匯出備份。</span><button class="btn" data-act="backup">匯出備份</button></div>';

function openDlg(title,body,save,extra='',okLabel='儲存'){

const srcSelect=sel=>`<select name="source" id="f-src">${Object.entries(SRC).map(([k,v])=>`<option value="${k}" ${(sel||'self')===k?'selected':''}>${v.full}</option>`).join('')}</select>`;
const clashBox='<div class="clashnote" id="f-clash" hidden></div>';
/* live clash check inside any dialog that has date/start/end fields */
function liveClash(){
  const box=document.getElementById('f-clash');if(!box||!editing)return;
  const d=document.getElementById(editing.date)?.value,s=document.getElementById(editing.start)?.value;
  let e=editing.end?document.getElementById(editing.end)?.value:'';
  if(editing.mins){const m=+document.getElementById(editing.mins)?.value;if(s&&m)e=hm(toMin(s)+m)}
  const c=clashFor(d,s,e,editing.key);
  let msg=c.length?'！這段時間已經有：'+c.map(spanTxt).join('、'):'';
  if(editing.end&&s&&e&&toMin(e)<=toMin(s))msg=(msg?msg+'<br>':'')+'結束時間要晚於開始時間';
  box.innerHTML=msg;box.hidden=!msg;
}

/* ---------- vacations: mark a date range, then decide each lesson in it ---------- */
const vacOn=d=>S.vacations.find(v=>v.start<=d&&d<=v.end);
function vacLessons(v){
  const out=[];let d=v.start;
  for(let i=0;i<120&&d<=v.end;i++){
    for(const s of S.students){
      const l=S.lessons.find(x=>x.id===d+'_'+s.id);
      if(!l&&!occurs(s,d))continue;
      const st=!l?'pending':l.status==='moved'?'moved':l.vacKeep&&!l.status?'keep':l.status||'pending';
      out.push({date:d,s,l,state:st});
    }
    d=addDays(d,1);
  }
  return out.sort((a,b)=>(a.date+(a.s.time||'')).localeCompare(b.date+(b.s.time||'')));
}
const vacPending=v=>vacLessons(v).filter(x=>x.state==='pending').length;

function deliveryLine(i){

/* ---------- tuition reminders ---------- */
function tuitionAlerts(){
  const out=[];
  for(const s of S.students){
    if(s.active===false||!(s.days||[]).length)continue;
    const hasPay=S.payments.some(p=>p.studentId===s.id);
    const top=tuitionPeriods(s)[0];if(!top)continue;
    if(!top.pay){if(hasPay||top.used>0)out.push({s,left:0,used:top.used})}
    else{const left=top.cap-top.used;if(left<=1)out.push({s,left,used:top.used})}
  }
  return out;
}
const parentOf=s=>(s.parent||'').trim()||s.name+'媽媽';
const tuitionMsg=s=>`${parentOf(s)}您好，下一次上課就是新的一期了（${money(s.fee*4)}），提醒您繳費囉☺️`;
function copyText(txt,msg){
  const done=()=>toast(msg||'已複製，可以貼到 LINE 了');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='absolute';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch{toast('複製失敗，請長按訊息自行複製')}ta.remove()};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(done,fallback);else fallback();
}
function todayBoxes(){
  let h='';
  const ta=tuitionAlerts();
  if(ta.length)h+=`<div class="remind"><b>這週要收學費</b>${ta.map(x=>`<div class="tuitionmsg"><div class="between"><span style="font-weight:700">${esc(x.s.name)}・${x.left>0?`剩 ${x.left} 堂`:x.used?`已經上了 ${x.used} 堂未繳`:'這期用完了'}</span><button class="btn" data-act="copyMsg" data-id="${x.s.id}">複製提醒訊息</button></div><div class="msgtxt">${esc(tuitionMsg(x.s))}</div></div>`).join('')}</div>`;
  const ds=dueSoon();
  if(ds.length)h+=`<div class="clashbox"><b>攝影快到交件期限</b>${ds.map(i=>`<div class="between"><span>${esc(i.title||'拍攝')}・${deliveryLine(i).replace('已拍攝・','')}</span><button class="btn" data-act="delivered" data-id="${i.id}">已交件</button></div>`).join('')}</div>`;

}

  if(a==='delPersonal')del('personal',arg);
  if(a==='newScore')dlgScore(arg);
  if(a==='delMat'){const [sid,mid]=arg.split(':');const st=ST(sid);if(st)patch('students',sid,{materials:(st.materials||[]).filter(m=>m.id!==mid)})}
  if(a==='delScore'){const [sid,scid]=arg.split(':');const st=ST(sid);if(st)patch('students',sid,{scores:(st.scores||[]).filter(m=>m.id!==scid)})}
}
document.addEventListener('click',e=>{
  if(e.target.closest('a[href]'))return;
  const b=e.target.closest('[data-act]');
  if(b){const inDlg=b.closest('dialog');if(inDlg&&b.dataset.act!=='toggleScore'&&b.dataset.act!=='editScore')return;handle(b);return}
  const tb=e.target.closest('#tabs button');if(tb){if(tb.dataset.tab==='sign')signDate=todayISO();tb.classList.remove('bounce');void tb.offsetWidth;tb.classList.add('bounce');go(tb.dataset.tab)}
});
function go(t){tab=t;try{localStorage.setItem('tab',t==='stu'?'students':t==='vac'?'cal':t)}catch{}render();scrollTo(0,0)}
document.addEventListener('change',e=>{
  if(e.target.id==='signDate'&&e.target.value){signDate=e.target.value;render()}
  if(e.target.id==='monthPick'&&e.target.value){month=e.target.value;render()}
  if(e.target.id==='f-src'){const sel=document.getElementById('f-minutes');if(sel){const k=e.target.value;sel.innerHTML=minOpts({source:k},SRC[k].def)}}
  if(e.target.id==='f-inst'){const w=document.getElementById('f-inst-other-wrap');if(w)w.hidden=e.target.value!=='其他'}
  if(editing&&Object.values(editing).includes(e.target.id))liveClash();
  if(e.target.dataset.mat&&stuId){const st=ST(stuId);if(st){const f=e.target.dataset.f;const v=f==='done'?e.target.checked:e.target.value.trim();patch('students',st.id,{materials:(st.materials||[]).map(m=>m.id===e.target.dataset.mat?{...m,[f]:v}:m)})}}
  if(e.target.id==='f-pallday'){const w=document.getElementById('f-ptimes');if(w)w.hidden=e.target.checked}
  if(e.target.id==='f-inodep'){const w=document.getElementById('f-depwrap');if(w)w.hidden=e.target.checked}
  if(e.target.id==='f-iclient'){const c=e.target.value.trim();const prev=S.income.filter(x=>x.type==='photo'&&x.client===c).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(prev){const nd=document.getElementById('f-inodep');if(nd&&prev.noDeposit&&!nd.checked){nd.checked=true;document.getElementById('f-depwrap').hidden=true}
      const ct=document.getElementById('f-icontact');if(ct&&!ct.value&&prev.contact){ct.value=prev.contact;ct.dispatchEvent(new Event('input',{bubbles:true}))}}}
});
document.addEventListener('compositionend',e=>{if(e.target.id==='stuSearch'){stuQuery=e.target.value;filterStudents()}});
document.addEventListener('input',e=>{
  if(e.target.id==='stuSearch'){stuQuery=e.target.value;if(!e.isComposing)filterStudents();return}if(editing&&e.target.type==='time'&&Object.values(editing).includes(e.target.id))liveClash();
  if(e.target.id==='np-n'){const a=document.getElementById('np-amt');if(a)a.value=(+e.target.dataset.fee||0)*(+e.target.value||0)}
  if(e.target.id==='f-icontact'){const p=document.getElementById('f-icontact-preview');if(p)p.innerHTML=contactHtml(e.target.value)||'貼上 IG 網址會自動變成可點的 IG 連結'}});
function syncSel(){if(!calSel.startsWith(month))calSel=todayISO().startsWith(month)?todayISO():month+'-01'}
function handle(b){
  const d=b.dataset;
  switch(d.act){
    case 'day':{signDate=addDays(signDate,+d.n);render();break}
    case 'month':{const [y,m]=month.split('-').map(Number);month=iso(new Date(y,m-1+ +d.n,1)).slice(0,7);render();break}
    case 'pick':calSel=d.d;render();break;
    case 'jump':calSel=d.d;go('cal');break;
    case 'calView':calView=d.v;render();break;
    case 'calNav':{const n=+d.n;if(calView==='month'){const x=parse(calSel);calSel=iso(new Date(x.getFullYear(),x.getMonth()+n,1))}else calSel=addDays(calSel,calView==='week'?7*n:n);render();break}
    case 'calToday':calSel=todayISO();render();break;
    case 'signMode':signMode=d.v;render();break;
    case 'back':go('students');break;
    case 'editStudent':dlgStudent(d.id);break;
    case 'newScoreFor':dlgScore(d.id);break;
    case 'delMat':{const st=ST(stuId);if(st)patch('students',st.id,{materials:(st.materials||[]).filter(m=>m.id!==d.id)});break}
    case 'addMat':{const st=ST(stuId);const t=document.getElementById('nm-title').value.trim();if(!st||!t){toast('先輸入教材名稱');break}
      patch('students',st.id,{materials:[...(st.materials||[]),{id:rid('m'),title:t,done:false,start:todayISO()}]});break}
    case 'addPay':{const st=ST(stuId);const n=+document.getElementById('np-n').value;if(!st||!(n>0)){toast('先填這次繳了幾堂');break}
      put('payments',rid('p'),{studentId:st.id,date:document.getElementById('np-date').value||todayISO(),lessons:n,amount:+document.getElementById('np-amt').value||st.fee*n});toast('已記錄繳費');break}
    case 'delPay':del('payments',d.id);toast('已刪除繳費');break;
    case 'goSign':signDate=d.d;go('sign');break;
    case 'newShootOn':dlgIncome(null,'photo',d.d);break;
    case 'newScoreOn':dlgScore(S.students[0]?.id,null,d.d);break;
    case 'mark':{const s=ST(d.sid);const id=signDate+'_'+s.id;const cur=S.lessons.find(l=>l.id===id);
      if(d.st==='leave'){dlgLeave({type:'reg',sid:s.id,cur});break}
      if(cur&&cur.status===d.st)del('lessons',id);
      else put('lessons',id,{studentId:s.id,source:s.source||'self',date:signDate,status:d.st,fee:cur?.fee??s.fee,minutes:cur?.minutes??s.minutes??src(s).def,note:cur?.note??''});
      break}
    case 'markX':{const l=S.lessons.find(x=>x.id===d.id);if(!l)break;if(d.st==='leave'){dlgLeave({type:'extra',l});break}patch('lessons',l.id,{status:l.status===d.st?'':d.st});break}
    case 'move':dlgMove(d.sid,signDate);break;
    case 'undoMove':{const o=S.lessons.find(x=>x.id===signDate+'_'+d.sid);if(o){if(o.movedId)del('lessons',o.movedId);del('lessons',o.id);toast('已取消調課')}break}
    case 'editLesson':dlgLesson(d.sid);break;
    case 'addLesson':dlgExtra();break;
    case 'editExtra':dlgExtra(d.id);break;
    case 'delLesson':{const l=S.lessons.find(x=>x.id===d.id);del('lessons',d.id);if(l?.kind==='moved'&&l.fromDate&&l.studentId){del('lessons',l.fromDate+'_'+l.studentId);toast('已取消調課，回到原本的時間')}break}
    case 'newStudent':dlgStudent();break;
    case 'openStudent':stuId=d.id;logShown=4;openPeriods=new Set();go('stu');break;
    case 'newPay':dlgPay(d.id);break;
    case 'newMat':dlgMat(d.id);break;
    case 'signToday':signDate=todayISO();render();break;
    case 'newPersonal':dlgPersonal(null,d.d);break;
    case 'editPersonal':dlgPersonal(d.id);break;
    case 'copyTxt':copyText(d.t,d.msg);break;
    case 'copyMsg':{const s=ST(d.id);if(s)copyText(tuitionMsg(s));break}
    case 'delivered':patch('income',d.id,{delivered:true,deliveredDate:todayISO()});toast('已標記交件');break;
    case 'newVac':dlgVac(null,d.d);break;
    case 'editVac':dlgVac(d.id);break;
    case 'openVac':vacId=d.id;go('vac');break;
    case 'backCal':go('cal');break;
    case 'delVac':del('vacations',d.id);go('cal');toast('已刪除休假，已經做的調課和請假都保留');break;
    case 'vacMove':dlgMove(d.sid,d.d);break;
    case 'vacKeep':{const s=ST(d.sid);put('lessons',d.d+'_'+s.id,{studentId:s.id,source:s.source||'self',date:d.d,status:'',vacKeep:true,fee:s.fee,minutes:s.minutes??src(s).def,note:''});break}
    case 'vacLeave':dlgLeave({type:'reg',sid:d.sid,date:d.d,cur:S.lessons.find(l=>l.id===d.d+'_'+d.sid)});break;
    case 'vacReset':{const o=S.lessons.find(l=>l.id===d.d+'_'+d.sid);if(o){if(o.movedId)del('lessons',o.movedId);del('lessons',o.id)}break}
    case 'moneyMode':moneyMode=d.v;render();break;
    case 'yearNav':yearSel=String(+yearSel+ +d.n);render();break;
    case 'pickMonth':month=d.m;moneyMode='month';render();scrollTo(0,0);break;
    case 'togglePeriod':openPeriods.has(d.id)?openPeriods.delete(d.id):openPeriods.add(d.id);render();break;
    case 'logMore':logShown+=4;render();break;
    case 'logLess':logShown=4;render();break;
    case 'editIncome':dlgIncome(d.id);break;
    case 'newPhoto':dlgIncome(null,'photo');break;
    case 'newOther':dlgIncome(null,'other');break;
    case 'togglePaid':{const i=S.income.find(x=>x.id===d.id);patch('income',d.id,i.paid?{paid:false}:{paid:true,depositPaid:true});break}
    case 'toggleDeposit':{const i=S.income.find(x=>x.id===d.id);patch('income',d.id,{depositPaid:!i.depositPaid,deposit:+i.deposit||DEPOSIT});break}
    case 'editScore':dlgScore(d.sid,d.scid);break;
    case 'toggleScore':{const st=ST(d.sid);if(!st)break;const list=(st.scores||[]).map(x=>x.id===d.scid?{...x,[d.f]:!x[d.f]}:x);
      patch('students',d.sid,{scores:list});break}
    case 'goPhoto':go('photo');break;
  }
}

/* ---------- boot (Firebase) ---------- */
document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=pix(el.dataset.icon,+(el.dataset.size||26)));
{const n=new Date();document.getElementById('issueNo').textContent=n.getFullYear()+'.'+String(n.getMonth()+1).padStart(2,'0')+'.'+String(n.getDate()).padStart(2,'0')}

const conn=document.getElementById('conn');
const viewEl=document.getElementById('view');
const nav=document.getElementById('tabs');
let user=null, unsubs=[];
function setConn(){conn.textContent=!user?'':navigator.onLine?'已同步':'離線中・恢復網路後自動同步'}
addEventListener('online',setConn);addEventListener('offline',setConn);

function showSetup(){
  nav.hidden=true;
  viewEl.innerHTML=`<div class="panel" style="padding:20px;display:flex;flex-direction:column;gap:10px">
    <h2>還差一步：連上 Firebase</h2>
    <p style="margin:0">打開 <b>config.js</b>，把 Firebase 專案的設定貼進去，再重新上傳到 GitHub。步驟寫在 README 的「步驟 4」。</p></div>`;
}
function showLogin(msg=''){
  nav.hidden=true;
  viewEl.innerHTML=`<form class="panel login" id="loginForm">
    <div class="row" style="gap:10px">${pix('logo',48)}<h2 style="font-size:22px">PATTY.STUDIO</h2></div>
    <label class="field">Email<input type="email" id="f-email" name="email" autocomplete="username" required></label>
    <label class="field">密碼<input type="password" id="f-pass" name="password" autocomplete="current-password" required></label>
    ${msg?`<div class="clashnote">${esc(msg)}</div>`:''}
    <button class="btn primary" type="submit" id="loginBtn">登入</button>
    <button class="btn ghost" type="button" data-act="resetPw">忘記密碼</button>
  </form>`;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;
  e.preventDefault();
  const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='登入中…';
  try{await firebase.auth().signInWithEmailAndPassword(document.getElementById('f-email').value.trim(),document.getElementById('f-pass').value)}
  catch(err){showLogin(err.code==='auth/network-request-failed'?'連不上網路，請確認網路後再試。':'Email 或密碼不正確。')}
});

function startData(){
  nav.hidden=false;
  const root=firebase.firestore().collection('users').doc(user.uid);
  db={collection:c=>root.collection(c)};
  loaded.clear();render();setConn();
  unsubs=COLS.map(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded.add(c);render();maybeOfferImport()},e=>{conn.textContent='同步錯誤';toast(e.message||e.code)}));
}
/* first run: bring over what was in the Claude version of the ledger */
let importOffered=false;
async function maybeOfferImport(){
  if(importOffered||loaded.size<COLS.length)return;
  importOffered=true;
  try{if(localStorage.getItem('imported'))return}catch{}
  if(COLS.some(c=>S[c].length))return;
  let data;try{data=await (await fetch('initial-data.json',{cache:'no-store'})).json()}catch{return}
  const n=COLS.reduce((a,c)=>a+(data[c]||[]).length,0);if(!n)return;
  window._importData=data;
  openDlg('匯入原本的資料？',`<p style="margin:0">之前在 Claude 帳本裡記的 ${n} 筆資料（${(data.income||[]).map(i=>esc(i.title)).join('、')}）可以一次搬過來。</p>`,
    async()=>{const b=firebase.firestore().batch();
      for(const c of COLS)for(const r of (data[c]||[])){const {id,...rest}=r;b.set(db.collection(c).doc(id),rest)}
      try{await b.commit()}catch(e){}try{localStorage.setItem('imported','1')}catch{};toast('已匯入原本的資料')},'','匯入');
}
function exportBackup(){
  const data={exportedAt:new Date().toISOString(),...Object.fromEntries(COLS.map(c=>[c,S[c]]))};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
  a.download=`patty-studio-備份-${todayISO()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='logout'){unsubs.forEach(u=>u());unsubs=[];COLS.forEach(c=>S[c]=[]);firebase.auth().signOut()}
  if(b.dataset.act==='backup')exportBackup();
  if(b.dataset.act==='resetPw'){const em=document.getElementById('f-email')?.value.trim();if(!em){toast('先在上面填 Email');return}
    firebase.auth().sendPasswordResetEmail(em).then(()=>toast('已寄出重設密碼信'),()=>toast('寄送失敗，請確認 Email'))}
},true);

(function(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||cfg.apiKey.startsWith('貼上')){showSetup();return}
  firebase.initializeApp(cfg);
  firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{});
  viewEl.innerHTML='<div class="panel empty">讀取中…</div>';
  firebase.auth().onAuthStateChanged(u=>{
    user=u; setConn();
    document.getElementById('logoutBtn').hidden=!u;
    if(!u){db=null;showLogin();return}
    startData();
  });
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
